name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The latest Claude Code: a change in its API shows here before it reaches anyone's install.
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude --version
      - run: claude plugin validate .
      - run: claude plugin test .
      - run: python3 scripts/flags-table.py --check
      - run: python3 scripts/footprint.py

  # A version in plugin.json that has no release yet gets one, its notes taken from the CHANGELOG.
  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release the version once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          python3 scripts/release-notes.py "$version" > notes.md
          gh release create "v$version" --title "realce $version" --notes-file notes.md --target "$GITHUB_SHA"
